name: Commit Lint

on:
  pull_request:
    branches: [ main ]
    types: [ opened, edited, reopened, synchronize ]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ===========================================================================
  # Validate the PR title (becomes the squash-merge commit message)
  # ===========================================================================
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Validate PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the PR title "{title}"
            didn't match the configured pattern. The subject must start with
            a lowercase character.
          wip: true
          validateSingleCommit: false

  # ===========================================================================
  # Validate every commit on the PR branch
  # ===========================================================================
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Under pull_request_target, the default ref is the base branch.
          # Explicitly check out the PR head so we can validate its commits.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install commitlint
        run: |
          npm install --no-save \
            @commitlint/cli \
            @commitlint/config-conventional

      - name: Write commitlint config
        run: |
          cat > commitlint.config.cjs <<'EOF'
          module.exports = {
            extends: ['@commitlint/config-conventional'],
            rules: {
              'subject-case': [2, 'never', ['upper-case', 'pascal-case', 'start-case']],
              'header-max-length': [2, 'always', 100],
              'body-max-line-length': [2, 'always', 100],
              'footer-max-line-length': [2, 'always', 100],
            },
          };
          EOF

      - name: Lint commits in PR range
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
